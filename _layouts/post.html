---
layout: default
---
<article class="post">
  <header class="entry-header">
    <h1 class="entry-title">{{ page.title }}</h1>
  </header>
  {% if page.image %}
  <div class="post-thumbnail">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" />
  </div>
  {% endif %}
  <div class="entry-content">
    {{ content }}
  </div>
</article>
