<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700|Titillium+Web:400,600,700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div id="page" class="site">
  <div class="outerContainer">
    {% include header.html %}
    <div class="header-container">
      <img src="{{ '/assets/images/logo/cropped-output-onlinepngtools-1.png' | relative_url }}" width="780" height="149" alt="{{ site.title }}">
    </div>
    <div id="content" class="site-content">
      <div id="primary" class="content-area">
        <main id="main" class="site-main">
          {{ content }}
        </main>
      </div>
    </div>
    {% include footer.html %}
  </div>
</div>
<script>
(function () {
  var btn = document.querySelector('.site-branding .menu-button');
  var nav = document.querySelector('.main-navigation');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    if (window.innerWidth <= 1200) {
      nav.style.display = (nav.style.display === 'block') ? 'none' : 'block';
    }
  });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 1200) {
      nav.style.display = '';
    }
  });
})();
</script>
</body>
</html>
